{% extends "base.html" %}

{% block title %}{{ 'Edit Task' if task else 'New Task' }}{% endblock %}

{% block content %}
<header class="page-head">
  <div>
    <h1>{{ 'Edit Task' if task else 'New Task' }}</h1>
    <p>{{ 'Update the details below.' if task else 'Add something to your list.' }}</p>
  </div>
</header>

<form method="POST" class="card">
  <div class="field">
    <label for="title">Title</label>
    <input type="text" class="form-control" id="title" name="title" maxlength="200" value="{{ values.get('title', '') }}" required>
  </div>
  <div class="field">
    <label for="description">Description</label>
    <textarea class="form-control" id="description" name="description" rows="3">{{ values.get('description', '') }}</textarea>
  </div>
  <div class="form-row">
    <div class="field">
      <label for="priority">Priority</label>
      <select class="form-control" id="priority" name="priority">
        {% for p in priorities %}
        <option value="{{ p }}" {% if values.get('priority') == p %}selected{% endif %}>{{ p|capitalize }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="status">Status</label>
      <select class="form-control" id="status" name="status">
        {% for s in statuses %}
        <option value="{{ s }}" {% if values.get('status') == s %}selected{% endif %}>{{ s|replace('_', ' ')|capitalize }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="due_date">Due date</label>
      <input type="date" class="form-control" id="due_date" name="due_date" value="{{ values.get('due_date', '') }}">
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{ 'Save changes' if task else 'Create task' }}</button>
    <a class="btn btn-link" href="{{ url_for('views.home') }}">Cancel</a>
  </div>
</form>
{% endblock %}
