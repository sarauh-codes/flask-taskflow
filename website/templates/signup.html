{% extends "base.html" %} {% block title %}Signup{% endblock %}

{% block content %}
<h1>Create your account</h1>
<p class="muted">Start organising your tasks in minutes.</p>
<form method="POST">
  <div class="field">
    <label for="email">Email address</label>
    <input type="email" class="form-control" id="email" name="email" placeholder="Enter email">
  </div>
  <div class="field">
    <label for="firstName">First name</label>
    <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Enter first name">
  </div>
  <div class="field">
    <label for="password1">Password</label>
    <input type="password" class="form-control" id="password1" name="password1" placeholder="Enter password">
  </div>
  <div class="field">
    <label for="password2">Confirm password</label>
    <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm password">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>
<p class="muted" style="margin-top:18px;text-align:center;">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
